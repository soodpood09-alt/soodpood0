name: Android CI Build

# Triggers the workflow on push or pull requests targeting your main branches
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-apk:
    name: Compile and Build Android APK
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the project source code
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Set up Java Development Kit (JDK 17 required for modern Android/Compose architectures)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Step 3: Grant execute permissions to the Gradle Wrapper script
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Step 4: Cache the Native C/C++ Build Dependencies (NDK) to speed up compilation
    # This project compiles native libraries (.so files) for arm64-v8a, armeabi-v7a, x86, and x86_64
    - name: Cache Android NDK and CMake
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/ndk
          ${{ android_home }}/ndk
        key: ${{ runner.os }}-ndk-cache

    # Step 5: Build Debug APK using the Gradle wrapper
    # This automatically compiles the source code across multi-DEX files
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # Step 6: Locate and upload the built APK file as a downloadable artifact
    - name: Upload Build Artifact (Debug APK)
      uses: actions/upload-artifact@v4
      with:
        name: fdroid-basic-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
        
