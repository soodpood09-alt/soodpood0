name: Automatic IPTV Player Builder

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch: # Allows you to manually trigger this build from the GitHub Actions tab

jobs:
  build-iptv:
    name: Download and Compile IPTV App
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout your empty workflow repository
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    # Step 2: Automatically download the open-source IPTV Player Source Code
    - name: Download IPTV Source Code
      uses: actions/checkout@v4
      with:
        repository: 'm3u-player/Kodiak-Player' # Open-source Android IPTV player project
        path: 'iptv-source'                     # Downloads it into a folder named iptv-source

    # Step 3: Set up Java Development Kit (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 4: Prepare Gradle Wrapper if missing
    - name: Prepare Gradle Wrapper
      working-directory: iptv-source
      run: |
        if [ ! -f ./gradlew ]; then
          echo "⚠️ gradlew wrapper missing. Generating a clean wrapper..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x ./gradlew

    # Step 5: Compile the IPTV source code into a Debug APK
    - name: Build IPTV Player APK
      working-directory: iptv-source
      run: ./gradlew assembleDebug

    # Step 6: Dynamic discovery to find and upload the compiled IPTV player APK
    - name: Locate and Upload IPTV APK
      uses: actions/upload-artifact@v4
      with:
        name: custom-iptv-player-apk
        path: |
          iptv-source/**/*.apk
        if-no-files-found: error
        retention-days: 7
        
