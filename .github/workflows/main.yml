name: Android CI Build

# Triggers the workflow on push or pull requests targeting your main branches
on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-apk:
    name: Compile and Build Android APK
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the project source code completely
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Step 2: Set up Java Development Kit (Upgraded to v5 to fix deprecation)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        # Fallback locator: Searches the entire workspace for build files to resolve the caching error
        cache-dependency-path: |
          **/build.gradle*
          **/gradle-wrapper.properties
          **/gradle.versions.toml

    # Step 3: Grant execute permissions to the Gradle Wrapper script wherever it lives
    - name: Grant Execute Permission for Gradlew
      run: |
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew
        else
          find . -name "gradlew" -exec chmod +x {} +
        fi

    # Step 4: Cache the Native C/C++ Build Dependencies (NDK) to speed up compilation
    - name: Cache Android NDK and CMake
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/ndk
          ${{ env.ANDROID_HOME }}/ndk
        key: ${{ runner.os }}-ndk-cache

    # Step 5: Dynamically locate gradlew and build the Debug APK
    - name: Build Debug APK with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew wrapper not found anywhere in the repository!"
          exit 1
        fi
        cd $(dirname "$GRADLEW_PATH")
        ./gradlew assembleDebug

    # Step 6: Locate and upload the built APK file as a downloadable artifact
    - name: Upload Build Artifact (Debug APK)
      uses: actions/upload-artifact@v4
      with:
        name: fdroid-basic-debug-apk
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7
        
