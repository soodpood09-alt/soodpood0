name: Build Android APK for Android 14

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    # Globally overrides the Buildozer root privilege check blocker
    env:
      BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Removed libtinfo5 which is unavailable in Ubuntu 24.04
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential

      # Installs modern Python core architecture
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 virtualenv buildozer setuptools

      # Creates specification profiles on the host workspace
      - name: Generate Buildozer Specification
        run: |
          buildozer init
          sed -i 's/# title = My Application/title = OpenBulletToPython/' buildozer.spec
          sed -i 's/# package.name = myapp/package.name = openbullettopython/' buildozer.spec
          sed -i 's/# package.domain = org.test/package.domain = org.openbullet/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 34/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,beautifulsoup4/' buildozer.spec

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}

      # Automatically handles interactive prompts via piped inputs
      - name: Compile Application Package
        run: |
          yes | buildozer -v android debug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBulletToPython-Android14-APK
          path: bin/*.apk
          
