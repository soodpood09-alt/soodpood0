name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Uses the official pre-configured Kivy environment (no slow system downloads)
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Speeds up future runs by saving the compiled project dependencies
      - name: Cache Buildozer Project Folder
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      # Compiles the APK and safely forces root permissions / license acceptances
      - name: Build APK with Buildozer
        env:
          BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: 1
        run: |
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BulletDroid-debug-APK
          path: bin/*.apk
          
