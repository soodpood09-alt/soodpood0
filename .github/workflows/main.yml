name: Automatic IPTV Player Builder

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch: 

jobs:
  build-iptv:
    name: Download and Compile IPTV App
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout your empty workflow repository
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    # Step 2: Download the active public open-source IPTV Player Source Code
    - name: Download IPTV Source Code
      uses: actions/checkout@v4
      with:
        repository: 'anilg21/Next-Stream' # Active, public open-source Android IPTV Player
        path: 'iptv-source'

    # Step 3: Set up Java Development Kit (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 4: Ensure the Gradle script executor is ready inside the folder
    - name: Prepare Gradle Wrapper
      working-directory: iptv-source
      run: |
        if [ ! -f ./gradlew ]; then
          echo "⚠️ gradlew wrapper missing. Generating a clean wrapper..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x ./gradlew

    # Step 5: Compile the app code into a runnable Debug APK
    - name: Build IPTV Player APK
      working-directory: iptv-source
      run: ./gradlew assembleDebug

    # Step 6: Scan the build environment dynamically to upload your finished player
    - name: Locate and Upload IPTV APK
      uses: actions/upload-artifact@v4
      with:
        name: next-stream-iptv-player
        path: |
          iptv-source/**/*.apk
        if-no-files-found: error
        retention-days: 7
        
