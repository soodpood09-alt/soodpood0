name: Automatic F-Droid APK Builder

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch: 

jobs:
  build-f-droid:
    name: Download and Compile F-Droid APK
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout Workflow Repository
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    # Step 2: Download the official F-Droid Source Code
    - name: Download F-Droid Source Code
      uses: actions/checkout@v4
      with:
        repository: 'f-droid/fdroidclient' 
        path: 'fdroid-source'             

    # Step 3: Set up Java Development Kit (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 4: Prepare Gradle Wrapper
    - name: Prepare Gradle Wrapper
      working-directory: fdroid-source
      run: |
        if [ ! -f ./gradlew ]; then
          echo "⚠️ gradlew wrapper missing. Generating a clean wrapper..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x ./gradlew

    # Step 5: Compile F-Droid
    - name: Build F-Droid APK
      working-directory: fdroid-source
      run: ./gradlew assembleDebug

    # Step 6: Dynamic discovery to target the artifact exactly where it was generated
    - name: Locate and Upload Generated F-Droid APK
      uses: actions/upload-artifact@v4
      with:
        name: official-fdroid-debug-apk
        path: |
          fdroid-source/**/*.apk
        if-no-files-found: error
        retention-days: 7
        
