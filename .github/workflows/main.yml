name: Automatic F-Droid APK Builder

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch: # Allows you to manually trigger this build from the GitHub UI

jobs:
  build-f-droid:
    name: Download and Compile F-Droid APK
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout YOUR empty repository first (so GitHub registers the workflow run)
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    # Step 2: Automatically download the official F-Droid Source Code into the runner
    - name: Download F-Droid Source Code
      uses: actions/checkout@v4
      with:
        repository: 'f-droid/fdroidclient' # Official F-Droid repository
        path: 'fdroid-source'             # Downloads it into a folder named fdroid-source

    # Step 3: Set up Java Development Kit (JDK 17) required by F-Droid
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 4: Fix permissions and ensure the Gradle Wrapper exists
    - name: Prepare Gradle Wrapper
      working-directory: fdroid-source
      run: |
        if [ ! -f ./gradlew ]; then
          echo "⚠️ gradlew wrapper missing. Generating a clean wrapper..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x ./gradlew

    # Step 5: Automatically compile the official F-Droid code into a Debug APK
    - name: Build F-Droid APK
      working-directory: fdroid-source
      run: ./gradlew assembleDebug

    # Step 6: Locate the automatically generated APK and upload it as a Github Artifact
    - name: Upload Generated F-Droid APK
      uses: actions/upload-artifact@v4
      with:
        name: official-fdroid-debug-apk
        path: 'fdroid-source/app/build/outputs/apk/debug/*.apk'
        retention-days: 7
        
