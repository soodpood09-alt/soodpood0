name: Android CI Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-apk:
    name: Compile and Build Android APK
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the project source code explicitly pointing to the current ref
    # We remove the depth constraint to make sure it pulls the full history
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Step 2: DEBUG STEP - List all files in the repository
    # This will show you exactly what GitHub Actions sees after checking out your code
    - name: Inspect Workspace Directory Structure
      run: |
        echo "=== Current working directory ==="
        pwd
        echo "=== Listing all files recursively ==="
        find . -maxdepth 3 -not -path '*/.*'

    # Step 3: Set up Java Development Kit (Temporarily disabling cache to bypass the hard crash)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 4: Grant execute permissions to the Gradle Wrapper script wherever it lives
    - name: Grant Execute Permission for Gradlew
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ ERROR: gradlew wrapper not found anywhere in the repository!"
          echo "Please look at the 'Inspect Workspace' step above to see your real folder structure."
          exit 1
        fi
        chmod +x "$GRADLEW_PATH"

    # Step 5: Cache the Native C/C++ Build Dependencies (NDK) to speed up compilation
    - name: Cache Android NDK and CMake
      uses: actions/cache@v4
      with:
        path: |
          ~/.android/ndk
          ${{ env.ANDROID_HOME }}/ndk
        key: ${{ runner.os }}-ndk-cache

    # Step 6: Dynamically locate gradlew and build the Debug APK
    - name: Build Debug APK with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        cd $(dirname "$GRADLEW_PATH")
        ./gradlew assembleDebug

    # Step 7: Locate and upload the built APK file as a downloadable artifact
    - name: Upload Build Artifact (Debug APK)
      uses: actions/upload-artifact@v4
      with:
        name: fdroid-basic-debug-apk
        path: '**/build/outputs/apk/debug/*.apk'
        retention-days: 7
        
