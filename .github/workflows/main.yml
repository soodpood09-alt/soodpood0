name: Build Kivy APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer + Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ github.workspace }}/android-sdk
            ${{ github.workspace }}/android-ndk
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git zip unzip openjdk-17-jdk \
            zlib1g-dev libncurses5-dev libgtk-3-dev \
            libjpeg-dev libtiff-dev libsdl2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libmtdev-dev libgl1-mesa-dev libgles2-mesa-dev \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            cmake ninja-build

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade Cython buildozer

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          title = BulletApp
          package.name = bulletapp
          package.domain = org.example

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt
          source.exclude_dirs = tests,bin,__pycache__
          source.exclude_patterns = *.pyc,*.pyo

          version = 0.1
          requirements = python3,kivy,requests,retry_requests,urllib3

          orientation = portrait
          fullscreen = 0

          android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          android.api = 31
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Initialize Android SDK/NDK if needed
        run: |
          mkdir -p $ANDROID_HOME
          if [ ! -d "$ANDROID_HOME/platforms" ] || [ ! -d "$ANDROID_HOME/build-tools" ]; then
            echo "Initializing Android SDK..."
            yes | buildozer android update sdk
          fi

      - name: Build APK
        run: |
          echo "Starting Buildozer..."
          buildozer android debug 2>&1 | tee build.log
          echo "Build finished."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-debug-apk
          path: |
            bin/*.apk
            build.log
