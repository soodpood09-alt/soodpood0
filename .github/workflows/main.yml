name: Build Kivy APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            zlib1g-dev libncurses5-dev libgtk-3-dev \
            libjpeg-dev libtiff-dev libsdl2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libmtdev-dev libgl1-mesa-dev libgles2-mesa-dev \
            python3-pip python3-venv
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade buildozer cython

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          # (str) Title of your application
          title = BulletApp

          # (str) Package name
          package.name = bulletapp

          # (str) Package domain (needed for android/ios packaging)
          package.domain = org.example

          # (str) Source code where the main.py live
          source.dir = .

          # (list) Source files to include (let empty for all the files)
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt

          # (list) List of directories to exclude (let empty to not exclude anything)
          source.exclude_dirs = tests,bin,__pycache__

          # (list) List of exclusions using pattern matching
          source.exclude_patterns = *.pyc,*.pyo

          # (list) List of files to include, default to None
          source.include_patterns = src/*.png, src/*.jpg, src/*.jpeg

          # (str) Application versioning (method 1)
          version = 0.1

          # (list) Application requirements
          # comma separated e.g. requirements = sqlite3,kivy
          requirements = python3,kivy,requests,retry_requests,urllib3

          # (str) Supported orientation (one of landscape, portrait or all)
          orientation = portrait

          # (bool) Indicate if the application should be fullscreen or not
          fullscreen = 0

          # (string) Presplash of the application
          # presplash.filename = %(source.dir)s/data/presplash.png

          # (string) Icon of the application
          # icon.filename = %(source.dir)s/data/icon.png

          # (list) Permissions
          android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE

          # (int) Target Android API, should be as high as possible.
          android.api = 31

          # (int) Minimum API your APK will support.
          android.minapi = 21

          # (str) Android NDK version to use
          android.ndk = 25b

          # (bool) Accept Android SDK license
          android.accept_sdk_license = True

          [buildozer]
          # (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
          log_level = 2

          # (int) Path (and name) to the build directory
          build_dir = .buildozer

          # (int) Path where the built apk will be stored
          bin_dir = bin

          # (str) Warn about running build as root?
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-debug-apk
          path: bin/*.apk
