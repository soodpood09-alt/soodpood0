name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Buildozer Project Folder
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      # Explicitly pointing Buildozer to the GitHub Workspace directory
      - name: Build APK with Buildozer
        env:
          BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: 1
        run: |
          cd $GITHUB_WORKSPACE
          yes | buildozer android debug

      # Adjusted path to find the APK inside the workspace directory
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BulletDroid-debug-APK
          path: ${{ github.workspace }}/bin/*.apk
          
